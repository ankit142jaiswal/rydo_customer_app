name: rydo_customer
description: Rydo App - Book rides, track drivers, make payments

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  
  # UI & Navigation
  cupertino_icons: ^1.0.2
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.7
  
  # State Management
  provider: ^6.0.5
  
  # HTTP & API
  http: ^1.1.0
  dio: ^5.3.2
  
  # Maps & Location
  google_maps_flutter: ^2.5.0
  location: ^6.0.2
  geocoding: ^3.0.0
  geolocator: ^12.0.0
  
  # Real-time Communication
  socket_io_client: ^2.0.3+1
  
  # Payments
  razorpay_flutter: ^1.3.6
  
  # Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.2.2
  
  # Utilities
  intl: ^0.18.1
  url_launcher: ^6.1.14
  image_picker: ^1.0.4
  permission_handler: ^11.0.1
  
  # Local Notifications
  flutter_local_notifications: ^17.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/images/rydo_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
