# Sized for a 7-8 GB RAM machine. The template default (-Xmx8G) asked for more
# memory than the PC has and crashed the Gradle daemon ("insufficient memory").
org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -Djava.net.preferIPv4Stack=true
# Compile Kotlin inside the Gradle process instead of a second large JVM
kotlin.compiler.execution.strategy=in-process
# Fewer parallel workers = lower peak memory
org.gradle.workers.max=2
android.useAndroidX=true
android.enableJetifier=true
